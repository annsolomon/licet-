# Shared settings of the four portal services (HOD, Parent, Advisor, Notifier).
# Each service is the SAME jar started with a different profile: --spring.profiles.active=hod|parent|advisor|notify
spring.application.name=college-portals
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:college}
spring.datasource.password=${ORACLE_PASSWORD:college123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# attendance below this percentage is "low"
portal.low-threshold=75

# notification delivery (only used by the notify profile)
notify.poll-ms=3000
notify.log-file=${NOTIFY_LOG:../output/notifications.log}
# optional: POST every notification as JSON to this URL (Telegram/WhatsApp/SMS gateway bridge, webhook.site ...)
notify.webhook-url=${NOTIFY_WEBHOOK_URL:}
