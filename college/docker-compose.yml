# Optional: start only Oracle with `docker compose up -d` (run.sh does the same with plain `docker run`).
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: college-oracle
    ports: ["1521:1521"]
    environment:
      ORACLE_PASSWORD: oracle123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
volumes:
  oracle-data:
