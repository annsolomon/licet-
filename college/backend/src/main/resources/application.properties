# ---------------------------------------------------------------
# application.properties - settings read by Spring Boot at start-up.
# Every value can be overridden with an environment variable (the ${NAME:default} form).
# ---------------------------------------------------------------
server.port=8080
spring.application.name=college-academic-management

# ---- Oracle connection (JDBC URL: jdbc:oracle:thin:@//host:port/service) ----
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:college}
spring.datasource.password=${ORACLE_PASSWORD:college123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection pool (HikariCP): a few ready-made connections are reused instead of opening one per request
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
# -1 = start the web server even when Oracle is down (the /api/health endpoint then reports DOWN)
spring.datasource.hikari.initialization-fail-timeout=-1

# ---- Show every SQL statement JdbcTemplate runs (great for the live demo) ----
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# ---- Application settings ----
app.reports.dir=${REPORTS_DIR:../output}
app.low-attendance-threshold=75
