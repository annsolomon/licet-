# ---------------------------------------------------------------
# Profile "prod" (SPRING_PROFILES_ACTIVE=prod) - the public Render deployment.
# ---------------------------------------------------------------
server.port=${PORT:8080}
# Render terminates HTTPS in front of the app: trust its X-Forwarded-* headers (real client IP, https scheme)
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# no SQL statements in the logs
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

# small pool: Oracle Always Free allows ~20 sessions
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=20000

app.reports.dir=${REPORTS_DIR:/tmp/college-output}
app.require-custom-passwords=true
